<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Shema Games</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
  /* Layout: the chosen game fills the screen in a frame; the game picker is a card on top of it.
     Colours = Shema app light theme, app dark theme for dark mode (same tokens as the games). */
  :root {
    --bg-0: #eef1ec; --bg-1: #fbfcfa; --bg-2: #f3f5f1; --bg-3: #e4e9e2;
    --line: #d5dcd3; --line-bright: #b9c3b8;
    --amber: #b86b00; --amber-hi: #9a5900; --amber-glow: rgba(184, 107, 0, 0.14);
    --green: #1d8a4b; --red: #cc3326; --blue: #2a68b8;
    --text-0: #151b17; --text-1: #3a453e; --text-2: #66726a; --text-3: #909a92;
    --shadow: rgba(30, 40, 34, 0.14);
    --page-glow-a: rgba(184, 107, 0, 0.06); --page-glow-b: rgba(42, 104, 184, 0.05); --intro-glow: rgba(184, 107, 0, 0.10);
    --cls-alarm: #d81e34; --cls-dog: #a87b00; --cls-engine: #e05a00; --cls-music: #7a3ff2;
    --cls-power_tools: #00897b; --cls-voices: #c21e8f; --cls-weather: #1f5fd6; --cls-background: #87918a;
    --sc-grass: #cfdac6; --sc-grass-2: #c6d3bc; --sc-pave: #dde3d9; --sc-road: #bcc4ba; --sc-road-line: #eef1ec;
    --sc-house-edge: #a9b4a8; --sc-roof-a: #cdb995; --sc-roof-b: #aebfca; --sc-roof-c: #cfb3af; --sc-roof-d: #bcc6a6;
    --sc-tree: #8fb27c; --sc-tree-2: #7aa067; --sc-jacaranda: #a68bd0; --sc-water: #b0c9dd; --sc-label: #5f6b63;
    --sc-night: rgba(20, 30, 60, 0.28); --sc-lamp: rgba(255, 214, 140, 0.55); --sc-window: #ffd98a;
    /* grandma's room */
    --rm-wall: #2d3a5c; --rm-wall-2: #34446b; --rm-moon: #fff1c4; --rm-wood: #9a6a43; --rm-wood-2: #7d5333;
    --rm-sheet: #f6f1e7; --rm-quilt: #c97b84; --rm-quilt-2: #e3a7a0; --rm-quilt-3: #8fb0c9; --rm-skin: #f2c7a5; --rm-cheek: #e88f8f;
    --rm-hair: #f4f4f2; --rm-cap: #7a8fd1; --rm-ink: #2b2a33; --rm-z: #cfd8ff; --rm-lamp: #ffd98a; --rm-slipper: #e57aa0;
    --mono: 'JetBrains Mono', ui-monospace, Consolas, monospace;
    --sans: 'Inter', system-ui, 'Segoe UI', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg-0: #0e1210; --bg-1: #151a17; --bg-2: #1b211d; --bg-3: #232a25;
      --line: #2c342e; --line-bright: #3a453d;
      --amber: #f5a623; --amber-hi: #ffb84d; --amber-glow: rgba(245, 166, 35, 0.15);
      --green: #5fd88f; --red: #e8564a; --blue: #5b9bd8;
      --text-0: #eef2ee; --text-1: #b7c2ba; --text-2: #7c887f; --text-3: #4d574f;
      --shadow: rgba(0, 0, 0, 0.45);
      --page-glow-a: rgba(245, 166, 35, 0.05); --page-glow-b: rgba(91, 155, 216, 0.04); --intro-glow: rgba(245, 166, 35, 0.07);
      --cls-alarm: #ff4d5e; --cls-dog: #ffd23f; --cls-engine: #ff8c32; --cls-music: #b98cff;
      --cls-power_tools: #2ee6d6; --cls-voices: #ff6fcf; --cls-weather: #4f8fff; --cls-background: #8c978f;
      --sc-grass: #141d17; --sc-grass-2: #18221b; --sc-pave: #1c231e; --sc-road: #242b26; --sc-road-line: #46514a;
      --sc-house-edge: #3a453d; --sc-roof-a: #3a3328; --sc-roof-b: #28343e; --sc-roof-c: #3a2c2b; --sc-roof-d: #2e3624;
      --sc-tree: #22362a; --sc-tree-2: #2a4231; --sc-jacaranda: #463a62; --sc-water: #1a2a37; --sc-label: #7c887f;
      --sc-night: rgba(0, 4, 14, 0.30); --sc-lamp: rgba(255, 200, 110, 0.30); --sc-window: #e0a94a;
      --rm-wall: #1a2238; --rm-wall-2: #1f2944; --rm-sheet: #d9d4ca;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg-0: #0e1210; --bg-1: #151a17; --bg-2: #1b211d; --bg-3: #232a25;
    --line: #2c342e; --line-bright: #3a453d;
    --amber: #f5a623; --amber-hi: #ffb84d; --amber-glow: rgba(245, 166, 35, 0.15);
    --green: #5fd88f; --red: #e8564a; --blue: #5b9bd8;
    --text-0: #eef2ee; --text-1: #b7c2ba; --text-2: #7c887f; --text-3: #4d574f;
    --shadow: rgba(0, 0, 0, 0.45);
    --page-glow-a: rgba(245, 166, 35, 0.05); --page-glow-b: rgba(91, 155, 216, 0.04); --intro-glow: rgba(245, 166, 35, 0.07);
    --cls-alarm: #ff4d5e; --cls-dog: #ffd23f; --cls-engine: #ff8c32; --cls-music: #b98cff;
    --cls-power_tools: #2ee6d6; --cls-voices: #ff6fcf; --cls-weather: #4f8fff; --cls-background: #8c978f;
    --sc-grass: #141d17; --sc-grass-2: #18221b; --sc-pave: #1c231e; --sc-road: #242b26; --sc-road-line: #46514a;
    --sc-house-edge: #3a453d; --sc-roof-a: #3a3328; --sc-roof-b: #28343e; --sc-roof-c: #3a2c2b; --sc-roof-d: #2e3624;
    --sc-tree: #22362a; --sc-tree-2: #2a4231; --sc-jacaranda: #463a62; --sc-water: #1a2a37; --sc-label: #7c887f;
    --sc-night: rgba(0, 4, 14, 0.30); --sc-lamp: rgba(255, 200, 110, 0.30); --sc-window: #e0a94a;
    --rm-wall: #1a2238; --rm-wall-2: #1f2944; --rm-sheet: #d9d4ca;
    color-scheme: dark;
  }


  :root { --rn-sky-a: #141c38; --rn-sky-b: #2b3a66; --rn-wall: #3b3f5c; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; overflow: hidden; }
  body {
    margin: 0; background: var(--bg-0); color: var(--text-0); font-family: var(--sans); font-size: 14px;
    background-image: radial-gradient(ellipse 1200px 600px at 15% -10%, var(--page-glow-a), transparent 60%),
      radial-gradient(ellipse 800px 500px at 100% 0%, var(--page-glow-b), transparent 60%);
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  iframe#game { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: var(--bg-0); }

  .shema-logo { height: 30px; width: auto; aspect-ratio: 932 / 316; flex-shrink: 0; overflow: visible; }
  .shema-logo .sl-l { fill: var(--amber); }
  .shema-logo .sl-lat path { fill: var(--text-0); }
  body.intro-on .picker .shema-logo { visibility: hidden; }

  /* ---------- game picker ---------- */
  .picker { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; overflow-y: auto;
    padding-block: calc(16px + env(safe-area-inset-top, 0px)) calc(16px + env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .picker.over { background: color-mix(in srgb, var(--bg-0) 70%, transparent); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
  .pcard { width: min(980px, 100%); display: flex; flex-direction: column; gap: 18px; background: var(--bg-1); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 16px 48px var(--shadow); padding: 22px; animation: rise .35s cubic-bezier(.2, .8, .3, 1); }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .phead { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .phead .sub { font-family: var(--mono); font-size: 9px; line-height: 1.35; letter-spacing: .12em; color: var(--text-3); padding-left: 10px; border-left: 1px solid var(--line-bright); }
  .phead .close { margin-left: auto; }
  .ptitle { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -.02em; text-wrap: balance; }
  .ptitle + p { margin: -10px 0 0; color: var(--text-2); line-height: 1.5; }
  .tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
  .tile { display: flex; flex-direction: column; text-align: left; padding: 0; border: 2px solid var(--line); border-radius: 14px; background: var(--bg-2); cursor: pointer; overflow: hidden; min-width: 0; transition: border-color .15s, transform .15s, box-shadow .15s; }
  .tile:hover { border-color: var(--amber); transform: translateY(-2px); box-shadow: 0 8px 22px var(--shadow); }
  .tile:active { transform: translateY(0); }
  .tile.current { border-color: var(--amber); }
  .art { position: relative; aspect-ratio: 16 / 9; overflow: hidden; }
  .tbody { display: flex; flex-direction: column; gap: 6px; padding: 14px 16px 16px; }
  .tag { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--amber); display: flex; gap: 8px; align-items: center; }
  .tag .now { margin-left: auto; color: var(--bg-1); background: var(--amber); padding: 2px 7px; border-radius: 999px; letter-spacing: .06em; }
  .tname { font-size: 20px; font-weight: 800; letter-spacing: -.01em; }
  .tdesc { color: var(--text-1); line-height: 1.45; font-size: 14px; }
  .go { margin-top: 6px; display: inline-flex; align-self: flex-start; align-items: center; gap: 8px; background: var(--amber); color: var(--bg-1); font-weight: 700; font-size: 15px; padding: 9px 16px; border-radius: 9px; }
  .tile:hover .go { background: var(--amber-hi); }
  .btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--bg-1); border-radius: 8px; padding: 7px 12px; cursor: pointer; font-family: var(--mono); font-size: 12px; color: var(--text-1); white-space: nowrap; }
  .btn:hover { border-color: var(--line-bright); }
  .note { font-family: var(--mono); font-size: 11px; color: var(--text-2); display: flex; align-items: center; gap: 8px; }
  .note svg { width: 14px; height: 14px; color: var(--amber); flex-shrink: 0; }

  /* tile art: drawn with the games' own colours and sprites */
  .art.night { background: linear-gradient(180deg, var(--rm-wall), var(--rm-wall-2)); }
  .art .moon { position: absolute; right: 12%; top: 16%; width: 15%; aspect-ratio: 1; border-radius: 50%; background: var(--rm-moon); box-shadow: 0 0 30px color-mix(in srgb, var(--rm-moon) 50%, transparent); }
  .art .moon::after { content: ""; position: absolute; inset: -8% -8% 18% 28%; border-radius: 50%; background: var(--rm-wall); }
  .art .roofs { position: absolute; left: 0; right: 0; bottom: 0; height: 34%; background: var(--rm-wood-2); clip-path: polygon(0 40%, 14% 0, 28% 40%, 28% 20%, 46% 20%, 46% 40%, 60% 6%, 76% 40%, 76% 26%, 100% 26%, 100% 100%, 0 100%); }
  .art .win { position: absolute; bottom: 10%; width: 5%; aspect-ratio: 1; background: var(--rm-lamp); border-radius: 2px; }
  .art .zz { position: absolute; left: 14%; top: 14%; font-weight: 800; color: var(--rm-z); font-size: clamp(18px, 4vw, 30px); letter-spacing: .1em; transform: rotate(-12deg); }
  .art .zz span { display: inline-block; animation: zz 2.4s ease-in-out infinite; }
  .art .zz span:nth-child(2) { animation-delay: .3s; font-size: 1.25em; } .art .zz span:nth-child(3) { animation-delay: .6s; font-size: 1.5em; }
  @keyframes zz { 0%, 100% { transform: translateY(0); opacity: .55; } 50% { transform: translateY(-5px); opacity: 1; } }
  .art.street { background: repeating-linear-gradient(90deg, var(--sc-grass) 0 18px, var(--sc-grass-2) 18px 36px); }
  .art .road { position: absolute; left: 0; right: 0; top: 34%; height: 18%; background: var(--sc-road); border-block: 5px solid var(--sc-pave); }
  .art .arc { position: absolute; inset: 0; width: 100%; height: 100%; }
  .art .sp { position: absolute; width: 17%; aspect-ratio: 1; border-radius: 50%; background-color: var(--bg-1); border: 3px solid var(--c); background-size: 600% 100%; background-repeat: no-repeat; box-shadow: 0 3px 8px var(--shadow); animation: sp .9s steps(6) infinite; }
  @keyframes sp { from { background-position: 0 0; } to { background-position: 120% 0; } }
  .art .dev { position: absolute; left: 50%; bottom: 7%; width: 8%; height: 5%; margin-left: -4%; background: var(--amber); border-radius: 3px; }
  .art.run { background: linear-gradient(180deg, var(--rn-sky-a), var(--rn-sky-b)); }
  .art.run .moon { right: 8%; top: 12%; width: 12%; }
  .art.run .moon::after { background: var(--rn-sky-a); }
  .art .rooftops { position: absolute; left: 0; right: 0; bottom: 0; height: 38%; background: var(--rn-wall); clip-path: polygon(0 18%, 30% 18%, 30% 100%, 40% 100%, 40% 0, 74% 0, 74% 100%, 82% 100%, 82% 26%, 100% 26%, 100% 100%, 0 100%); }
  .art .sq { position: absolute; left: 30%; bottom: 40%; width: 26%; aspect-ratio: 1; background-size: 600% 100%; background-repeat: no-repeat; animation: sp .7s steps(6) infinite, hop 1.4s ease-in-out infinite; }
  @keyframes hop { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-34%); } }
  @media (prefers-reduced-motion: reduce) { .art .sp, .art .sq, .art .zz span, .pcard { animation: none; } }

  @media (max-width: 760px) and (orientation: portrait) {
    .pcard { padding: 16px; gap: 14px; }
    .ptitle { font-size: 22px; }
    .tiles { grid-template-columns: minmax(0, 1fr); gap: 10px; }
    .tile { flex-direction: row; align-items: stretch; }
    .art { aspect-ratio: auto; width: 36%; flex-shrink: 0; min-height: 118px; }
    .tbody { padding: 12px; gap: 4px; }
    .tname { font-size: 18px; } .tdesc { font-size: 13px; }
    .go { font-size: 14px; padding: 7px 12px; }
  }
  @media (orientation: landscape) and (max-height: 520px) {
    .pcard { padding: 14px 16px; gap: 10px; }
    .ptitle { font-size: 20px; }
    .ptitle + p { display: none; }
    .art { aspect-ratio: 21 / 9; }
    .tbody { padding: 10px 12px; gap: 4px; }
    .tdesc { font-size: 13px; }
  }

  /* ---------- how to hold the phone: a badge on each tile, and a step before the game starts ---------- */
  .hold { display: inline-flex; align-self: flex-start; align-items: center; gap: 7px; padding: 4px 10px 4px 7px; border-radius: 999px; background: var(--amber-glow); color: var(--amber-hi); font-weight: 700; font-size: 12px; }
  .hold svg { width: 18px; height: 18px; flex-shrink: 0; }
  .hold.wide svg { transform: rotate(-90deg); }
  .hold.ok { background: color-mix(in srgb, var(--green) 14%, transparent); color: var(--green); }
  .hold.ok::after { content: "✓"; font-weight: 800; }

  .gate { position: fixed; inset: 0; z-index: 60; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center;
    padding: calc(24px + env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(24px, env(safe-area-inset-left, 0px));
    background: var(--bg-0); background-image: radial-gradient(ellipse 700px 460px at 50% 42%, var(--intro-glow), transparent 65%); animation: gateIn .3s ease; }
  @keyframes gateIn { from { opacity: 0; } to { opacity: 1; } }
  .gate.leave { opacity: 0; transition: opacity .35s ease; pointer-events: none; }
  .gate .gname { font-family: var(--mono); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--amber); }
  .gate .phone { width: clamp(120px, 34vmin, 190px); aspect-ratio: 1; color: var(--text-0); }
  .gate .phone .body { transform-box: view-box; transform-origin: 50% 50%; animation: toWide 2.6s cubic-bezier(.6, 0, .3, 1) infinite; }
  .gate.tall .phone .body { animation-name: toTall; }
  .gate .phone .arrow { color: var(--amber); transform-box: view-box; transform-origin: 50% 50%; animation: arrow 2.6s ease infinite; }
  .gate.tall .phone .arrow { transform: scaleX(-1); animation-name: arrowR; }
  @keyframes toWide { 0%, 18% { transform: rotate(0); } 55%, 88% { transform: rotate(-90deg); } 100% { transform: rotate(0); } }
  @keyframes toTall { 0%, 18% { transform: rotate(-90deg); } 55%, 88% { transform: rotate(0); } 100% { transform: rotate(-90deg); } }
  @keyframes arrow { 0%, 10% { opacity: 0; } 25%, 55% { opacity: 1; } 70%, 100% { opacity: 0; } }
  @keyframes arrowR { 0%, 10% { opacity: 0; transform: scaleX(-1); } 25%, 55% { opacity: 1; transform: scaleX(-1); } 70%, 100% { opacity: 0; transform: scaleX(-1); } }
  .gate h2 { margin: 0; font-size: clamp(24px, 6.5vmin, 34px); font-weight: 800; letter-spacing: -.02em; text-wrap: balance; }
  .gate p { margin: -6px 0 0; max-width: 34ch; color: var(--text-1); line-height: 1.5; font-size: 15px; }
  .gate .gacts { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 6px; }
  .gate .anyway { border: 1px solid var(--line-bright); background: var(--bg-1); color: var(--text-1); border-radius: 10px; padding: 11px 18px; font-weight: 600; font-size: 14px; cursor: pointer; }
  .gate .gback { border: 0; background: none; color: var(--text-2); font-family: var(--mono); font-size: 12px; cursor: pointer; padding: 6px; }
  .gate.done .phone .body, .gate.done .phone .arrow { animation: none; }
  .gate.done .phone .arrow { opacity: 0; }
  .gate.done:not(.tall) .phone .body { transform: rotate(-90deg); }
  .gate.done .phone .tick { opacity: 1; transform: none; }
  .gate .phone .tick { opacity: 0; transform: scale(.6); transform-box: fill-box; transform-origin: center; transition: opacity .2s ease, transform .3s cubic-bezier(.2, .9, .3, 1.3); color: var(--green); }
  .gate.done h2 { color: var(--green); }
  /* short, wide screens: phone left, words right */
  @media (orientation: landscape) and (max-height: 520px) {
    .gate { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 28px; row-gap: 10px; justify-content: center; align-content: center; text-align: left; }
    .gate .phone { grid-row: 1 / span 4; width: clamp(110px, 32vh, 160px); }
    .gate .gacts { align-items: flex-start; }
  }
  @media (prefers-reduced-motion: reduce) {
    .gate { animation: none; }
    .gate .phone .body, .gate .phone .arrow { animation: none; }
    .gate:not(.tall) .phone .body { transform: rotate(-90deg); }
  }

  /* opening sequence (same as the Shema app) */
  .intro { position: fixed; inset: 0; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; cursor: pointer; }
  .intro-bg { position: absolute; inset: 0; background: var(--bg-0); background-image: radial-gradient(ellipse 900px 520px at 50% 48%, var(--intro-glow), transparent 65%); transition: opacity .6s ease .15s; }
  .intro.fly .intro-bg { opacity: 0; }
  .intro.fly { pointer-events: none; }
  .intro-stage { position: relative; display: flex; align-items: center; justify-content: center; }
  .intro .shema-logo { position: relative; height: auto; width: min(78vw, 640px); transform-origin: 0 0; }
  .intro.fly .shema-logo { transition: transform .75s cubic-bezier(.65, 0, .25, 1); }
  .intro .sl-l { fill: transparent; stroke: var(--amber); stroke-width: 5; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1;
    animation: slDraw 1s cubic-bezier(.6, 0, .3, 1) calc(.25s + var(--i) * .22s) forwards, slFill .45s ease calc(1s + var(--i) * .22s) forwards; }
  .intro .sl-lat { opacity: 0; transform-box: fill-box; transform-origin: center; animation: slLat .6s cubic-bezier(.2, .9, .3, 1.15) 1.7s forwards; }
  .intro-ring { position: absolute; left: 50%; top: 50%; width: min(52vw, 420px); aspect-ratio: 1; margin: calc(min(52vw, 420px) / -2) 0 0 calc(min(52vw, 420px) / -2);
    border: 1.5px solid var(--amber); border-radius: 50%; opacity: 0; animation: slRing 1.8s cubic-bezier(.2, .6, .3, 1) calc(var(--r) * .35s) 2; pointer-events: none; }
  .intro-sub { position: relative; font-family: var(--mono); font-size: clamp(10px, 1.4vw, 13px); letter-spacing: .42em; color: var(--text-2); opacity: 0; transform: translateY(6px); animation: slSub .6s ease 2.15s forwards; padding-left: .42em; }
  .intro-skip { position: absolute; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); font-family: var(--mono); font-size: 10px; color: var(--text-3); opacity: 0; animation: slSub .4s ease .8s forwards; }
  .intro.fly .intro-sub, .intro.fly .intro-skip, .intro.fly .intro-ring { transition: opacity .25s ease; opacity: 0 !important; animation: none; }
  .intro.done .sl-l { animation: none; fill: var(--amber); stroke-width: 0; }
  .intro.done .sl-lat, .intro.done .intro-sub { animation: none; opacity: 1; transform: none; }

<script>
(() => {
  'use strict';
  const GAMES = {
    grandma: { src: 'grandma.html', name: 'Let Grandma Sleep', orient: 'portrait', why: 'Grandma sits above the street, so you can watch her and the noises at once.' },
    squirrel: { src: 'squirrel.html', name: 'Squirrel Run', orient: 'landscape', why: 'You see much further ahead across the rooftops, so there\u2019s time to jump.' },
    sandbox: { src: 'sandbox.html', name: 'Sandbox', orient: 'portrait', why: 'The street sits on top with the tray of noises under it, and Shema\u2019s readout has room to scroll below.' },
  };
  const picker = document.getElementById('picker'), btnBack = document.getElementById('btnBack');
  let frame = null, current = null, ac = null, bus = null;

  // One audio context for the whole app, made on the tap that picks a game so the browser lets it play.
  function context() {
    if (!ac) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null; ac = new AC(); }
    ShemaAudio.wake(ac);
    return ac;
  }
  window.ShemaShell = {
    // each game gets its own output, so switching games silences the old one at once
    audio() { const c = context(); if (!c) return null; bus = c.createGain(); bus.connect(c.destination); return { ac: c, out: bus }; },
    openPicker,
  };

  function call(name, arg) { try { frame && frame.contentWindow[name] && frame.contentWindow[name](arg); } catch (e) { } }
  function openPicker() {
    call('__shemaPause', true);
    picker.classList.toggle('over', !!frame);
    btnBack.hidden = !frame;
    btnBack.textContent = current ? `Back to ${GAMES[current].name}` : 'Back';
    document.querySelectorAll('.tile').forEach(t => {
      const on = t.dataset.game === current;
      t.classList.toggle('current', on); t.querySelector('.now').hidden = !on;
      t.querySelector('.go').textContent = on ? 'Keep playing' : t.dataset.go;
    });
    picker.hidden = false;
    (current ? document.querySelector(`.tile[data-game="${current}"]`) : document.getElementById('tileGrandma')).focus({ preventScroll: true });
  }
  function closePicker() { picker.hidden = true; call('__shemaPause', false); try { frame.focus(); } catch (e) { } }
  function pick(game) {
    context();                              // unlock sound inside this tap
    if (game === current && frame) { closePicker(); return; }
    if (frame) { call('__shemaStop'); try { bus && bus.disconnect(); } catch (e) { } frame.remove(); frame = null; }
    current = game;
    try { localStorage.setItem('shema.lastGame', game); } catch (e) { }
    frame = document.createElement('iframe');
    frame.id = 'game'; frame.title = GAMES[game].name; frame.allow = 'autoplay';
    frame.src = GAMES[game].src + '?embed=1';
    document.body.insertBefore(frame, picker);
    picker.hidden = true;
    const gated = showGate(game);
    frame.addEventListener('load', () => { if (!gate.hidden) call('__shemaPause', true); else try { frame.contentWindow.focus(); } catch (e) { } });
    if (!gated) try { frame.focus(); } catch (e) { }
  }

  // ---- how to hold the phone: shown after picking a game, only on phones held the wrong way ----
  const gate = document.getElementById('gate');
  const touch = matchMedia('(hover: none) and (pointer: coarse)');
  const upright = matchMedia('(orientation: portrait)');
  let doneTimer = 0;
  const isPhone = () => touch.matches && Math.min(screen.width, screen.height) < 820;
  const held = () => upright.matches ? 'portrait' : 'landscape';
  function showGate(game) {
    const g = GAMES[game];
    if (!isPhone() || held() === g.orient) return false;
    const tall = g.orient === 'portrait';
    gate.classList.toggle('tall', tall); gate.classList.remove('done', 'leave');
    document.getElementById('gateName').textContent = g.name;
    document.getElementById('gateH').textContent = tall ? 'Hold your phone upright' : 'Turn your phone sideways';
    document.getElementById('gateP').textContent = g.why;
    gate.hidden = false;
    document.getElementById('gateGo').focus({ preventScroll: true });
    return true;
  }
  function closeGate() {
    if (gate.hidden) return;
    clearTimeout(doneTimer);
    gate.classList.add('leave');
    setTimeout(() => { gate.hidden = true; gate.classList.remove('leave', 'done'); }, 350);
    call('__shemaPause', false);
    try { frame.focus(); frame.contentWindow.focus(); } catch (e) { }
  }
  function onTurn() {
    if (gate.hidden || gate.classList.contains('done') || !current || held() !== GAMES[current].orient) return;
    gate.classList.add('done');
    document.getElementById('gateH').textContent = 'That\u2019s it!';
    document.getElementById('gateP').textContent = 'Starting ' + GAMES[current].name + '\u2026';
    doneTimer = setTimeout(closeGate, 900);
  }
  upright.addEventListener ? upright.addEventListener('change', onTurn) : upright.addListener(onTurn);
  window.addEventListener('resize', onTurn);
  document.getElementById('gateGo').addEventListener('click', closeGate);
  document.getElementById('gateBack').addEventListener('click', () => { clearTimeout(doneTimer); gate.hidden = true; openPicker(); });

  // tile badges turn green when the phone is already held the right way
  function markBadges() {
    const phone = isPhone();
    document.querySelectorAll('.hold').forEach(b => b.classList.toggle('ok', phone && b.dataset.orient === held()));
  }
  markBadges();
  upright.addEventListener ? upright.addEventListener('change', markBadges) : upright.addListener(markBadges);
  document.querySelectorAll('.tile').forEach(t => t.addEventListener('click', () => pick(t.dataset.game)));
  btnBack.addEventListener('click', closePicker);
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && frame && !picker.hidden && gate.hidden) closePicker(); });
  try { if (localStorage.getItem('shema.sound') === '0') document.getElementById('sndNote').textContent = 'Sound is off. Turn it on with the speaker button in the game.'; } catch (e) { }

  // ---- opening sequence (same as the Shema app): the logo lands in the picker card ----
  (function () {
    const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const intro = document.getElementById('intro');
    const target = document.querySelector('.picker .shema-logo');
    const logo = target.cloneNode(true);
    intro.querySelector('.intro-stage').appendChild(logo);
    const INTRO_HOLD_MS = 2950, INTRO_FLY_MS = 800;
    let flying = false, holdTimer = 0;
    function fly() {
      if (flying) return; flying = true; clearTimeout(holdTimer);
      intro.classList.add('done');
      const from = logo.getBoundingClientRect(), to = target.getBoundingClientRect();
      void logo.offsetWidth; intro.classList.add('fly');
      if (to.width > 0 && from.width > 0) logo.style.transform = `translate(${to.left - from.left}px, ${to.top - from.top}px) scale(${to.width / from.width})`;
      else logo.style.opacity = '0';
      setTimeout(finish, INTRO_FLY_MS);
    }
    function finish() { document.body.classList.remove('intro-on'); intro.remove(); document.removeEventListener('keydown', onKey, true); openPicker(); }
    function onKey(e) { e.preventDefault(); e.stopPropagation(); fly(); }
    intro.addEventListener('click', fly);
    document.addEventListener('keydown', onKey, true);
    if (reduced) { intro.classList.add('done'); holdTimer = setTimeout(fly, 400); }
    else holdTimer = setTimeout(fly, INTRO_HOLD_MS);
  })();
})();
</script>

<script src="shema-egg.js"></script>
